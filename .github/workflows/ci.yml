name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm comes from the packageManager field in package.json. pnpm 12 needs a
      # newer corepack than the one bundled with Node.
      - run: npm install -g corepack@latest && corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mvd/mock-oidc exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests (Node and Chromium)
        run: pnpm test
      - name: E2E tests (vite-dev, vite-static and playwright-adapter)
        run: pnpm test:e2e
      - name: Lint the packed package (publint)
        run: pnpm lint:publish
      - run: pnpm --filter @mvd/mock-oidc-e2e typecheck
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7
